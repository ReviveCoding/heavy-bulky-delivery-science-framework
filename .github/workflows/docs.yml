name: documentation
on:
  push:
  pull_request:
jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify documentation-only scope and links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          readme = Path("README.md")
          assert readme.is_file()
          text = readme.read_text(encoding="utf-8")
          assert "documentation only" in text.lower()
          assert "does not include executable" in text.lower()
          for target in re.findall(r"\]\(([^)]+)\)", text):
              if target.startswith(("http://", "https://", "#", "mailto:")):
                  continue
              assert (readme.parent / target.split("#", 1)[0]).exists(), target
          print("Documentation scope and local links validated")
          PY